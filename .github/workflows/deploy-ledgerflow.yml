name: LedgerFlow CD (OIDC)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ledgerflow-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and package
        working-directory: RallTheoryGroup/src/financial-services/ledgerflow/src/LedgerFlow
        run: |
          dotnet restore
          dotnet build -c Release --no-restore
          dotnet publish -c Release --no-build -o publish
          cd publish
          zip -qr ../ledgerflow.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ledgerflow-package
          path: RallTheoryGroup/src/financial-services/ledgerflow/src/LedgerFlow/ledgerflow.zip
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ledgerflow-package
          path: package
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify scoped secret retrieval without output
        env:
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
        run: |
          set +x
          VALUE=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" \
            --name LedgerFlowDemoToken --query value -o tsv)
          test -n "$VALUE"
          MASK="${VALUE//'%'/'%25'}"
          MASK="${MASK//$'\r'/'%0D'}"
          MASK="${MASK//$'\n'/'%0A'}"
          printf '::add-mask::%s\n' "$MASK"
          unset MASK
          echo "Secret retrieval and presence check succeeded."
          unset VALUE
      - name: Deploy existing web app
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az webapp deploy --name "$WEBAPP" --resource-group "$RG" \
            --src-path package/ledgerflow.zip --type zip --output none
      - name: Verify deployment
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 10 --max-time 20 "https://${WEBAPP}.azurewebsites.net/health"
          curl --fail --silent --show-error "https://${WEBAPP}.azurewebsites.net/version"
